# XcodeGen 스펙:  brew install xcodegen && xcodegen generate && open BgPlay.xcodeproj
name: BgPlay
options:
  bundleIdPrefix: io.github.bgplay
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 본인 Apple 팀 ID (무료 Personal Team도 가능 — 7일마다 재설치)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BgPlay:
    type: application
    platform: iOS
    sources:
      - path: BgPlay
      # Android와 공유하는 주입 스크립트
      - path: ../shared/js/bgplay.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bgplay
        INFOPLIST_FILE: BgPlay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
