# Mappin 운영 스택: PostGIS + API + Web + Caddy(HTTPS)
# 사용: cd deploy && docker compose up -d --build   (설정은 deploy/.env)
name: mappin

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: mappin
      POSTGRES_USER: mappin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mappin -d mappin"]
      interval: 5s
      retries: 30
    # 외부에 포트를 열지 않는다 (컨테이너 내부 네트워크 전용)

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://mappin:${POSTGRES_PASSWORD}@db:5432/mappin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL 필요}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAP_STYLE: ${MAP_STYLE:-openfreemap}
      KAKAO_JS_KEY: ${KAKAO_JS_KEY:-}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Mappin <no-reply@localhost>}

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:8080

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN 필요 - 예 map.example.com 또는 :80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
